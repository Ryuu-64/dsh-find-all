name: Return reading position RC2
on:
  push:
    branches: [feat/return-reading-position]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: return-position-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rc2-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run check
      - run: npm install --global --ignore-scripts pnpm@11.19.0
      - run: npx playwright install chromium --only-shell
      - name: Pack this commit once
        id: artifact
        shell: bash
        run: |
          mkdir -p evidence/artifact
          artifact=$(npm pack --ignore-scripts --pack-destination evidence/artifact --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename')
          echo "path=evidence/artifact/$artifact" >> "$GITHUB_OUTPUT"
          sha256sum "evidence/artifact/$artifact" | tee evidence/artifact/SHA256SUMS
          git rev-parse HEAD > evidence/commit.txt
      - name: Test native return inputs and retained paging anchors
        run: node scripts/compat/return-position-web.mjs 0.2.0-rc.2 '${{ steps.artifact.outputs.path }}' evidence/rc2-web
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: return-reading-position-rc2
          path: evidence/
          retention-days: 7
